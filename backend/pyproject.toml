[project]
name = "spotter-backend"
version = "0.1.0"
description = "Spotter weather-aware truck routing API"
authors = [
    { name = "sakib-anjum-313", email = "sakibanjum.313@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-cors-headers>=4.6",
    "django-environ>=0.12",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "gunicorn>=23",
    "httpx>=0.28",
    "timezonefinder>=6.5",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "DJ", "N", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["^manage\\.py$"]

[[tool.mypy.overrides]]
module = ["environ.*", "timezonefinder.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "*.migrations.*"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["trips/tests"]
addopts = "-q --strict-markers --benchmark-disable"
