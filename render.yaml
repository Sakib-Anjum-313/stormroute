# Render Blueprint: free API web service (Docker) + free static site for the SPA.
# Runbook: docs/DEPLOY.md. Secrets (TOMTOM_API_KEY) are entered in the Render dashboard, never here.
#
# If Render gives a service a suffixed subdomain (e.g. stormroute-api-ab12.onrender.com), update
# CORS_ALLOWED_ORIGINS, VITE_API_BASE_URL and the CSP connect-src below once (DEPLOY.md step 3.4).
services:
  - type: web
    name: stormroute-api
    runtime: docker
    plan: free
    region: oregon
    # Paths are relative to the repo root (Blueprint spec), so no rootDir here.
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    buildFilter:
      paths: ["backend/**"]
      ignoredPaths: ["backend/trips/tests/**"]
    healthCheckPath: /api/healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # ALLOWED_HOSTS: settings add Render's RENDER_EXTERNAL_HOSTNAME automatically.
      - key: CORS_ALLOWED_ORIGINS
        value: https://stormroute-web.onrender.com
      - key: TOMTOM_API_KEY
        sync: false
      - key: PLAN_FIXTURES
        value: "0"
      # Trusted proxy hops for DRF throttling. Keep 0 until the smoke test shows how many
      # X-Forwarded-For entries Render adds (DEPLOY.md step 4.1).
      - key: DRF_NUM_PROXIES
        value: "0"

  - type: web
    name: stormroute-web
    runtime: static
    rootDir: frontend
    buildFilter:
      paths: ["frontend/**"]
      ignoredPaths: ["frontend/e2e/**"]
    autoDeployTrigger: checksPass
    # Render's preinstalled pnpm is unreliable and corepack may be unavailable: pin pnpm via npx.
    buildCommand: npx --yes pnpm@11.1.1 install --frozen-lockfile && npx --yes pnpm@11.1.1 run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_BASE_URL
        value: https://stormroute-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob: https://tiles.openfreemap.org;
          font-src 'self' data:;
          connect-src 'self' https://stormroute-api.onrender.com https://tiles.openfreemap.org;
          worker-src 'self' blob:;
          frame-ancestors 'none'
