# Render Blueprint: free API web service + free static site for the SPA.
# Secrets (TOMTOM_API_KEY) are set in the Render dashboard, never here.
services:
  - type: web
    name: spotter-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: spotter-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://spotter-web.onrender.com
      - key: TOMTOM_API_KEY
        sync: false
      - key: PLAN_FIXTURES
        value: "0"
      # Proxy hops in front of the app (docs/DEPLOY.md, "Proxy hops"); prompted at blueprint creation.
      - key: DRF_NUM_PROXIES
        sync: false

  - type: web
    name: spotter-web
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://spotter-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
